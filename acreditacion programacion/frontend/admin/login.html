<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración | BALANCE</title>

    <link rel="stylesheet" href="../css/styles.css">

    <script src="../js/admin-login.js" defer></script>
</head>

<body class="admin-login-body">

    <main class="admin-login-container">

        <a href="../index.html" class="brand login-brand">
            BALANCE<span>.</span>
        </a>

        <section class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <span class="eyebrow">
                ÁREA PRIVADA
            </span>

            <h1>Panel de administración</h1>

            <p>
                Ingresá tus credenciales para administrar
                las consultas recibidas.
            </p>

            <form id="login-form">

                <div class="form-group">

                    <label for="usuario">Usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresá tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="contrasena">Contraseña</label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresá tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit" class="btn login-button" id="login-button">
                    Iniciar sesión
                </button>

                <p id="login-message" class="form-message"
                    role="status" aria-live="polite"></p>

            </form>

            <a href="../index.html" class="login-back">
                ← Volver al sitio web
            </a>

        </section>

        <p class="login-copyright">
            © 2026 BALANCE. Todos los derechos reservados.
        </p>

    </main>

</body>

</html>
